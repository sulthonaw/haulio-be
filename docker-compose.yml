name: haulio-local-demo

services:
  # The backend joins the shared local-demo network and reaches the separately
  # started DS service through the stable service hostname `ds`.
  be:
    build:
      context: .
      target: runner
    # The user-provided key remains on the host in the ignored DS .env file.
    # The backend uses it only for on-demand Google Routes visualisation.
    env_file:
      - ../compfest-aic-2026-ds/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: http://127.0.0.1:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: haulio_demo
      DB_SYNCHRONIZE: "true"
      DS_API_URL: http://ds:8088/
      DS_IOT_SHARED_SECRET: ""
      MQTT_ENABLED: "false"
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: haulio/v1/telemetry
      MQTT_CLIENT_ID: haulio-local-demo
      IOT_DEVICE_MAPPINGS: "[]"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haulio_demo
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haulio_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_demo_data:/mosquitto/data

volumes:
  postgres_demo_data:
  mosquitto_demo_data:
