services:
  # NestJS Application
  api:
    build:
      context: .
      target: dependencies
    container_name: haulio_api_dev
    command: npm run start:dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=haulio_dev
      - DB_SYNCHRONIZE=true
      - CORS_ORIGIN=*
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: haulio_postgres_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=haulio_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haulio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Development-only, loopback-bound MQTT broker for exercising the gateway.
  # It deliberately has no credentials or TLS; do not deploy this configuration.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: haulio_mosquitto_dev
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data_dev:/mosquitto/data

volumes:
  postgres_data_dev:
  mosquitto_data_dev:
